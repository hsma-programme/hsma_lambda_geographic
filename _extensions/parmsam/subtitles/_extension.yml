title: Subtitles
author: parmsam
version: 1.2.0
quarto-required: '>=1.4.0'
source: parmsam/quarto-subtitles@v1.1.0
source-type: registry
contributes:
  revealjs-plugins:
    - name: RevealSubtitles
      script:
        - subtitles.js
      stylesheet:
        - subtitles.css
      config:
        subtitles:
          isVisible: true
          toggleKey: t
